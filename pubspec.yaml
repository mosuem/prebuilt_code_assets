name: prebuilt_code_assets
description: Shared build and link hook infrastructure for Dart packages with prebuilt and source-built native code assets, tree-shaking link hooks, and release tooling.
version: 0.1.1

repository: https://github.com/mosuem/prebuilt_code_assets

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  code_assets: ^2.1.0
  crypto: ^3.0.7
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.4
  record_use: ^1.1.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  test: ^1.32.0

topics:
  - ffi
  - hooks
  - code-assets
  - native-assets
